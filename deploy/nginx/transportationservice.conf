# /etc/nginx/sites-available/transportationservice.conf
#
# EXAMPLE nginx site for TransportationService (docs/delivery/operations.md §3.3).
# Replace tms.example.com and the certificate paths. One public origin serves the SPA and
# proxies /api/ to the single API instance on 127.0.0.1:5019 (see the systemd unit).
#
# Maintenance mode: while the file /var/www/transportationservice/maintenance/maintenance.on
# exists, every request (SPA and API) gets HTTP 503 with maintenance.html. The deploy script
# creates it before stopping the API and removes it once the new release is ready
# (MAINTENANCE_FLAG). It is evaluated per request: no reload needed.
#   sudo install -d -m 0755 /var/www/transportationservice/maintenance
#   sudo install -m 0644 deploy/nginx/maintenance.html /var/www/transportationservice/maintenance/
#
# Health endpoints: /health/live is public (process up, no details) for an external uptime
# probe. /health/ready (DB, storage, pending migrations) is NOT exposed: monitoring and the
# deploy script call it on 127.0.0.1:5019 directly.

upstream transportationservice_api {
    server 127.0.0.1:5019;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name tms.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tms.example.com;

    ssl_certificate     /etc/letsencrypt/live/tms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tms.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/transportationservice/TMS/TransportationService.Web/dist;
    index index.html;

    # Matches the API's Kestrel cap (32 MB); per-endpoint limits are enforced by the API.
    client_max_body_size 32m;

    # ---- maintenance mode -------------------------------------------------
    error_page 503 @maintenance;
    location @maintenance {
        root /var/www/transportationservice/maintenance;
        rewrite ^ /maintenance.html break;
        add_header Retry-After 300 always;
        add_header Cache-Control "no-store" always;
    }

    # ---- health ------------------------------------------------------------
    location = /health/live {
        if (-f /var/www/transportationservice/maintenance/maintenance.on) { return 503; }
        proxy_pass http://transportationservice_api;
        proxy_set_header Host $host;
        access_log off;
    }
    location /health/ {
        return 404;
    }

    # ---- API ---------------------------------------------------------------
    location /api/ {
        if (-f /var/www/transportationservice/maintenance/maintenance.on) { return 503; }
        proxy_pass http://transportationservice_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The API trusts forwarded headers only from Network:KnownProxies (127.0.0.1). The refresh
        # cookie's Secure flag and the per-IP login rate limit depend on these two headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- SPA ---------------------------------------------------------------
    # The service worker must not be cached long, or clients stay on an old shell.
    location = /sw.js {
        if (-f /var/www/transportationservice/maintenance/maintenance.on) { return 503; }
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location /assets/ {
        if (-f /var/www/transportationservice/maintenance/maintenance.on) { return 503; }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location / {
        if (-f /var/www/transportationservice/maintenance/maintenance.on) { return 503; }
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Nothing outside dist/ is ever served: storage, backups and the repo are not under root.
    location ~ /\. { deny all; }
}
