name: secret-scan

# Deliberately NO path filter: a leaked credential in docs/, scripts/ or config must
# fail CI even though the backend/frontend workflows would not trigger for it.
on:
  push:
    branches: [main, nav-redesign]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for secrets
        run: node scripts/secret-scan.mjs
